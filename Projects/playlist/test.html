<!DOCTYPE html>

<head>

    <title>Document</title>

    <style>
        body {
            background-color: grey;

        }



        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: grey;
        }

        .carousel {
            width: 90%;
            max-width: 1400px;
            height: 700px;
            overflow-x: auto;
            overflow-y: hidden;
            margin: 40px auto;
            display: flex;
            gap: 0;
            scroll-behavior: smooth;
            anchor-name: --carousel;
            scroll-snap-type: x mandatory;
            border: 2px solid black;
            border-radius: 15px;
        }

        .carousel::-webkit-scrollbar {
            display: none;
        }

        .carousel::scroll-button(right),
        .carousel::scroll-button(left) {
            content: ">";
            border: none;
            background-color: lightblue;
            font-size: 3rem;
            color: white;
            height: 60px;
            width: 60px;
            border-radius: 50%;
            padding-bottom: .1em;
            cursor: pointer;
            position: fixed;
            position-anchor: --carousel;
            position-area: right center;
            translate: -50%;
        }

        .carousel::scroll-button(right):disabled,
        .carousel::scroll-button(left):disabled {
            opacity: 0.5;
            cursor: auto;
        }

        .carousel::scroll-button(left) {
            content: "<";
            position-area: left center;
            translate: 50%;
        }

        .card {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            object-fit: cover;
            scroll-snap-align: start;
        }



        .carousel1 {
            width: 90%;
            max-width: 1000px;
            overflow-x: auto;
            margin: 3em auto;
            display: flex;
            gap: 1em;

    </style>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NI↗HA↘HA↗HA</title>

<style>
    
    body{
         margin:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:flex-start; /* Top */
    align-items:center;         /* Center horizontally */
    padding-top:40px;           /* Space from the top */
    background:#f5f5f5;
    font-family:Arial, sans-serif;
    }

    .container{
        display:flex;
        flex-direction:column;
        align-items:center;
        
        gap:25px;
    }

    img{
        width:400px;
        border-radius:15px;
    }

    button{
        padding:15px 50px;
        font-size:20px;
        border:none;
        border-radius:12px;
        background:#ec1d9d;
        color:white;
        cursor:pointer;
        transition:0.2s;
        box-shadow:0 5px 10px rgba(0,0,0,.2);
    }

    button:hover{
        background:#ff9800;
        transform:scale(1.05);
    }

    button:active{
        transform:scale(.95);
    }
</style>
</head>
<body>

<div class="container">
    <h1>Koyuki</h1>
    <img src="koyuki chocopuni.png">

    <button onclick="playRandomSound()">
        Start
    </button>

</div>

<audio id="clickSound"></audio>

<script>
function playRandomSound(){
    const sounds = [
        "koyuki 1.mp3",
        "koyuki 2.mp3",
        "koyuki 3.mp3",
        "koyuki 4.mp3"
    ];

    const audio = document.getElementById("clickSound");
    audio.src = sounds[Math.floor(Math.random() * sounds.length)];
    audio.currentTime = 0;
    audio.play();
}
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="en">

<head>

    <style>
        * {

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 420px;

            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h1 {
            color: #0984e3;

        p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #0984e3;
            margin: 20px 0;
        }

        ul,

            text-align: left;
            display: inline-block;
            margin-bottom: 15px;

        li {

        }

            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;

            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: #0767b5;
            transform: scale(1.05);
        }
